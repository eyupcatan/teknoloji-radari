version: 2
updates:
  # npm bağımlılıkları — haftalık otomatik güncellemeler
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    # Yalnızca güvenlik güncellemelerini PR olarak aç
    ignore: []

  # GitHub Actions — haftalık güncellemeler
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "github-actions"
      - "dependencies"

